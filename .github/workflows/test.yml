name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-15
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4
        id: chrome
      - name: Install macOS QR dependency
        if: runner.os == 'macOS'
        run: brew install zbar
      - name: Install Linux QR and OCR dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzbar0 tesseract-ocr
      - run: uv sync --extra test --locked --python '${{ matrix.python }}'
      - name: Test without contacting BOSS
        env:
          BOSS_TEST_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          BOSS_TEST_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: uv run --python '${{ matrix.python }}' pytest -q
      - run: uv build --wheel
